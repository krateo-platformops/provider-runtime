name: Test and coverage

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Gather dependencies
        run: go mod download
      # pkg/scaletozero tests Exists and Reconcile against envtest's
      # kube-apiserver and etcd. Under CI those tests fail rather than skip
      # when KUBEBUILDER_ASSETS is unset. setup-envtest is release-0.23,
      # pinned; 1.35.0 matches k8s.io/* v0.35.
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260305142021-f9589b9f2b9d
          echo "KUBEBUILDER_ASSETS=$("$(go env GOPATH)/bin/setup-envtest" use -p path 1.35.0)" >> "$GITHUB_ENV"
      - name: Run coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The org's shared workflows have no golangci-lint job: component-go-checks
  # runs only go vet and gofmt. This is the same check as `make lint`.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # go.mod, not 'stable': a pinned linter on a floating Go isn't pinned.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main