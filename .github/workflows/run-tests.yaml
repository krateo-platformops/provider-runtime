name: Test and coverage

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Gather dependencies
        run: go mod download
      # pkg/scaletozero tests Exists and Reconcile against envtest's
      # kube-apiserver and etcd. Under CI those tests fail rather than skip
      # when KUBEBUILDER_ASSETS is unset. setup-envtest is release-0.25,
      # pinned; 1.37.0 matches k8s.io/* v0.37.
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3-0.20261103101737-9603adbb18be
          # Assign first: a failed download inside echo's command substitution
          # doesn't fail the step, and the envtest tests then fail later with
          # a misleading message. As a plain assignment it fails here.
          assets="$("$(go env GOPATH)/bin/setup-envtest" use -p path 1.37.0)"
          test -n "$assets"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Run coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      # pkg/credentialuse's premise tests pin the API facts the credential-use
      # protocol rests on, the authorizer's exact RBAC message among them
      # (docs/design-credential-use-finalizer.md §6.2). The run above has them
      # on 1.37.0; this runs them again on Krateo's minimum Kubernetes, 1.36
      # (the user's decision, design §18), at its latest patch.
      - name: Premise tests on the minimum Kubernetes (1.36)
        run: |
          assets="$("$(go env GOPATH)/bin/setup-envtest" use -p path 1.36.2)"
          test -n "$assets"
          KUBEBUILDER_ASSETS="$assets" go test -race -count=1 -run '^TestPremise' ./pkg/credentialuse/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The org's shared workflows have no golangci-lint job: component-go-checks
  # runs only go vet and gofmt. This is the same check as `make lint`.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # go.mod, not 'stable': a pinned linter on a floating Go isn't pinned.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main