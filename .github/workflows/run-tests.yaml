name: Test and coverage

on:
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Gather dependencies
        run: go mod download
      # pkg/scaletozero tests Exists and Reconcile against envtest's
      # kube-apiserver and etcd. Under CI those tests fail rather than skip
      # when KUBEBUILDER_ASSETS is unset. setup-envtest is release-0.25,
      # pinned; 1.37.0 matches k8s.io/* v0.37.
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3-0.20261103101737-9603adbb18be
          # Assign first: a failed download inside echo's command substitution
          # doesn't fail the step, and the envtest tests then fail later with
          # a misleading message. As a plain assignment it fails here.
          assets="$("$(go env GOPATH)/bin/setup-envtest" use -p path 1.37.0)"
          test -n "$assets"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      # pkg/credentialuse's envtests run one at a time and took 468 to 480
      # seconds here in the last runs of #126, #127 and #129. go test's default
      # limit of 10 minutes a package would cut a larger run that is healthy. A
      # package that hangs is still cut, at 30.
      - name: Run coverage
        run: go test -race -timeout 30m -coverprofile=coverage.txt -covermode=atomic ./...
      # pkg/credentialuse's premise tests pin the API facts the credential-use
      # protocol rests on, the authorizer's exact RBAC message among them
      # (docs/design-credential-use-finalizer.md §6.2). The run above has them
      # on 1.37.0; this runs them again on Krateo's minimum Kubernetes, 1.36
      # (the user's decision, design §18), at its latest patch.
      - name: Premise tests on the minimum Kubernetes (1.36)
        run: |
          assets="$("$(go env GOPATH)/bin/setup-envtest" use -p path 1.36.2)"
          test -n "$assets"
          KUBEBUILDER_ASSETS="$assets" go test -race -count=1 -run '^TestPremise' ./pkg/credentialuse/
      # The credential-use protocol's schedules, searched exhaustively within
      # their bounds (pkg/credentialuse/model_test.go). Under -race the run
      # above walks random schedules only: the model runs one coroutine at a
      # time, so the race detector finds nothing there and only slows it.
      # The searches with one preemption and one fault together are about a
      # million schedules, so the step can take tens of minutes; -v logs each
      # search's size and time, and the random walks' seed. The comparison of
      # rule R against no R (TestModelStatefulAgreesWithStateless) skips here,
      # with no plan set: it is the model-differential job's.
      - name: Credential-use model, exhaustive schedules
        run: go test -v -count=1 -timeout 90m -run '^TestModel' ./pkg/credentialuse/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The credential-use model's comparison of the quiet-segment reduction
  # (rule R) against no reduction, on every push: the three Teardown
  # scenarios stateless, stateful and reduced, and AcquireAgainstRelease
  # stateful against reduced, at T = 2, {0,1} and {1,0}
  # (docs/credential-use-model-reduction.md §11.3, ciPlan). It is its own
  # job, on its own runner, because it doesn't fit the build job's model
  # step: there, beside the exhaustive searches, it ran past the step's 90m.
  # The 8 subtests run 4 at a time, each with its stateful legs beside its
  # stateless one; DIFF_WORKERS=4 splits a stateless leg across the 4 vCPU,
  # which the longest one, alone at the end, uses.
  model-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Gather dependencies
        run: go mod download
      # A misspelled -run pattern would say "no tests to run" and exit 0, so
      # the job also requires that as many subtests passed as the test's
      # plan line says it started. pipefail keeps a test failure a failure
      # through tee.
      - name: Credential-use model, rule R against no R
        env:
          CREDENTIALUSE_MODEL_DIFF_CI: "1"
          CREDENTIALUSE_MODEL_DIFF_WORKERS: "4"
        run: |
          set -o pipefail
          go test -v -count=1 -timeout 90m -run '^TestModelStatefulAgreesWithStateless$' ./pkg/credentialuse/ | tee differential.log
          want="$(sed -n 's/.*differential plan: \([0-9][0-9]*\) subtests.*/\1/p' differential.log | head -n1)"
          passed="$(grep -c -- '--- PASS: TestModelStatefulAgreesWithStateless/' differential.log || true)"
          echo "differential: ${passed} subtests passed, the plan started ${want:-none}"
          test -n "$want" && test "$want" -gt 0 && test "$passed" -eq "$want"

  # The org's shared workflows have no golangci-lint job: component-go-checks
  # runs only go vet and gofmt. This is the same check as `make lint`.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # go.mod, not 'stable': a pinned linter on a floating Go isn't pinned.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main